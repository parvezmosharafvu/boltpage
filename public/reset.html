<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset password · Boltpage</title>
  <meta name="theme-color" content="#0b0b0c">
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <script src="/config.js"></script>
  <script src="/vendor/supabase.js"></script>
  <script type="module" src="/auth.js"></script>
</head>
<body data-page="reset">
  <header class="site">
    <div class="container bar">
      <a class="brand" href="/"><svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="16" fill="#FFB800"/><path d="M36 8 L16 36 H30 L26 56 L48 26 H34 Z" fill="#0B0B0C"/></svg><span data-brand>Boltpage</span></a>
      <nav><button class="btn btn-ghost btn-sm" type="button" data-lang-toggle data-i18n="lang.toggle">বাংলা</button></nav>
    </div>
  </header>
  <main>
    <div class="container narrow">
      <div class="card raised">
        <h1 data-i18n="reset.title">Reset your password</h1>
        <p class="muted" data-i18n="reset.body">Enter your email and we'll send you a reset link.</p>
        <form id="reset-request" novalidate>
          <div class="field"><label for="email" data-i18n="login.email">Email</label><input id="email" name="email" type="email" autocomplete="email" required></div>
          <p class="error" data-form-error role="alert" hidden></p>
          <p class="notice" id="reset-sent" data-i18n="reset.sent" hidden>If an account exists for that email, a reset link is on its way.</p>
          <div class="form-actions"><button class="btn btn-primary btn-block" type="submit" data-i18n="reset.send">Send reset link</button></div>
        </form>
        <p class="small center"><a href="/login" data-i18n="nav.login">Log in</a></p>
      </div>
      <div class="card raised" hidden>
        <h1 data-i18n="reset.newTitle">Choose a new password</h1>
        <form id="reset-update" novalidate>
          <div class="field"><label for="new-password" data-i18n="reset.newPassword">New password</label><input id="new-password" name="password" type="password" autocomplete="new-password" required minlength="10"><p class="hint" data-i18n="reg.passwordHint">At least 10 characters</p></div>
          <div class="field"><label for="new-confirm" data-i18n="reg.confirm">Confirm password</label><input id="new-confirm" name="confirm" type="password" autocomplete="new-password" required></div>
          <p class="error" data-form-error role="alert" hidden></p>
          <div class="form-actions"><button class="btn btn-primary btn-block" type="submit" data-i18n="reset.save">Save password</button></div>
        </form>
      </div>
    </div>
  </main>
</body>
</html>
