<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in · Boltpage</title>
  <meta name="theme-color" content="#0b0b0c">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <script src="/config.js"></script>
  <script src="/vendor/supabase.js"></script>
  <script type="module" src="/auth.js"></script>
</head>
<body data-page="login">
  <header class="site">
    <div class="container bar">
      <a class="brand" href="/"><svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="16" fill="#FFB800"/><path d="M36 8 L16 36 H30 L26 56 L48 26 H34 Z" fill="#0B0B0C"/></svg><span data-brand>Boltpage</span></a>
      <nav>
        <button class="btn btn-ghost btn-sm" type="button" data-lang-toggle data-i18n="lang.toggle">বাংলা</button>
        <a class="btn btn-primary btn-sm" href="/register" data-i18n="nav.register">Create your link</a>
      </nav>
    </div>
  </header>
  <main>
    <div class="container narrow" id="login-area">
      <div class="card raised">
        <h1 data-i18n="login.title">Log in</h1>
        <form id="login-form" novalidate>
          <div class="field"><label for="email" data-i18n="login.email">Email</label><input id="email" name="email" type="email" autocomplete="email" required></div>
          <div class="field"><label for="password" data-i18n="login.password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
          <p class="error" data-form-error role="alert" hidden></p>
          <div class="form-actions"><button class="btn btn-primary btn-block" type="submit" data-i18n="login.submit">Log in</button></div>
        </form>
        <div class="row between small">
          <a href="/reset" data-i18n="login.forgot">Forgot password?</a>
          <span><span class="muted" data-i18n="login.noAccount">New here?</span> <a href="/register" data-i18n="nav.register">Create your link</a></span>
        </div>
      </div>
    </div>
  </main>
  <footer class="site">
    <div class="container">
      <span data-brand>Boltpage</span>
      <nav><a href="/terms" data-i18n="footer.terms">Terms</a><a href="/privacy" data-i18n="footer.privacy">Privacy</a><a href="/contact" data-i18n="footer.contact">Contact</a></nav>
    </div>
  </footer>
</body>
</html>
